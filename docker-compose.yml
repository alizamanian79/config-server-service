services:
  config-server:
    build:
      context: .
      args:
        SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
        SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
        SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
    ports:
      - "8888:8888"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: config-server
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8888}:${SERVER_PORT:-8888}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8888}/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s