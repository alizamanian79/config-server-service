spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URL}
          username: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
          default-label: ${SPRING_CLOUD_CONFIG_SERVER_GIT_BRANCH}
          search-paths:
            - '{application}-config'

management:
  endpoints:
    web:
      exposure:
        include: health,info


server:
  port: 8888